about.mission: Onafhankelijk meldpunt. Fabrikanten hoeven phantom braking nergens te registreren; deze verzameling meldingen maakt het probleem meetbaar.
about.privacy: Wij slaan je kenteken niet op. We bewaren alleen een onomkeerbare vingerafdruk om dubbele meldingen per voertuig te tellen. Dashcambeelden worden pas openbaar na controle en met jouw toestemming.
about.sources: 'Voertuiggegevens: <a class="underline" href="https://opendata.rdw.nl" rel="noopener">RDW Open Data</a>. Kaart: <a class="underline" href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a>. Meld een gevaarlijk voertuig ook bij de <a class="underline" href="https://www.ilent.nl" rel="noopener">ILT</a>.'
