method.title: Over deze cijfers
method.text: "Dit zijn meldingen van bestuurders, geen gecontroleerde ongevalsdata. Merk, model en bouwjaar komen via het kenteken uit het nationale register; we accepteren alleen meldingen uit landen waarvan we dat register kunnen raadplegen. Hogere aantallen bij een merk kunnen ook komen doordat dat merk veel rijdt; vergelijk daarom met het wagenpark. Meerdere meldingen van hetzelfde voertuig tellen als aparte incidenten, maar 'voertuigen' telt elk kenteken één keer."

