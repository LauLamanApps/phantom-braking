faq.title: "Veelgestelde vragen"
faq.intro: "Antwoorden op de meest gestelde vragen over phantom braking, melden en wat we met je gegevens doen."
faq.more: "Staat je vraag er niet bij? Neem contact op via de gegevens in de <a href=\"{privacy}\">privacyverklaring</a>."
glossary.title: "Begrippenlijst"
glossary.intro: "Wat betekenen AEB, ACC, GSR2 en de andere termen op deze site? Hier staan ze kort uitgelegd."
glossary.more: "Meer over het meldpunt zelf lees je bij de <a href=\"{faq}\">veelgestelde vragen</a>."
glossary.phantom_braking.term: "Spookremmen (phantom braking)"
glossary.phantom_braking.definition: "Een auto die uit zichzelf remt terwijl er niets is om voor te remmen. Het rijhulpsysteem ziet ten onrechte een obstakel, bijvoorbeeld in een schaduw, een viaduct of een vrachtwagen op de rijstrook ernaast. Het varieert van een korte waarschuwing tot een volledige noodstop."
glossary.false_positive.term: "Valse remingreep"
glossary.false_positive.definition: "Een ingreep van de noodremassistent zonder echte aanleiding: het systeem meende een botsing te zien die er niet was. Fabrikanten hoeven deze niet te melden, daarom verzamelt dit meldpunt ze."
glossary.aeb.term: "AEB (automatische noodrem)"
glossary.aeb.definition: "Autonomous Emergency Braking: een systeem dat met een camera en/of radar de weg voor de auto in de gaten houdt en zelf remt als een botsing dreigt. Het staat bij elke rit standaard aan, ook zonder cruise control. Sinds juli 2024 verplicht in elke nieuw geregistreerde auto in de EU (zie GSR2)."
glossary.fcw.term: "FCW (botsingswaarschuwing)"
glossary.fcw.definition: "Forward Collision Warning: waarschuwt met een geluid of lampje voor een dreigende botsing, vaak vlak voordat de automatische noodrem ingrijpt. Een melding met alleen een waarschuwing telt hier als de lichtste vorm van spookremmen."
glossary.adas.term: "ADAS (rijhulpsystemen)"
glossary.adas.definition: "Advanced Driver Assistance Systems: de verzamelnaam voor systemen die de bestuurder helpen, zoals de automatische noodrem, adaptieve cruise control en de rijstrookassistent. De bestuurder blijft altijd verantwoordelijk."
glossary.acc.term: "ACC (adaptieve cruise control)"
glossary.acc.definition: "Cruise control die zelf afstand houdt tot de auto ervoor: hij remt af en trekt weer op. ACC gebruikt dezelfde camera en radar als de noodrem en kan dus ook onterecht remmen."
glossary.lane_assist.term: "Rijstrookassistent"
glossary.lane_assist.definition: "Houdt de auto met kleine stuurcorrecties in het midden van de rijstrook. Samen met ACC stuurt, remt en versnelt de auto op de snelweg grotendeels zelf, onder toezicht van de bestuurder."
glossary.tad.term: "TAD (Tesla Assisted Driving)"
glossary.tad.definition: "Het rijhulpsysteem van Tesla dat eerder FSD (Full Self-Driving) heette. Het stuurt, remt en versnelt onder toezicht van de bestuurder; de auto rijdt niet zelfstandig."
glossary.sensors.term: "Camera en radar"
glossary.sensors.definition: "De ogen van de rijhulpsystemen. Een camera herkent vormen, maar kan verblind raken door laagstaande zon of in de war raken door schaduwen. Een radar meet afstand en snelheid, maar ziet vaste objecten zoals viaducten en borden soms als obstakel. Veel auto's combineren beide (sensorfusie)."
glossary.gsr2.term: "GSR2"
glossary.gsr2.definition: "De tweede General Safety Regulation van de EU (Verordening (EU) 2019/2144). Die maakt onder meer de automatische noodrem verplicht: voor nieuwe typen auto's sinds juli 2022, voor elke nieuw geregistreerde auto sinds juli 2024. Bij een voertuig tonen we of het na die datum is toegelaten."
glossary.rdw.term: "RDW"
glossary.rdw.definition: "De Rijksdienst voor het Wegverkeer: laat voertuigen toe op de Nederlandse weg en houdt het kentekenregister bij. Uit de open data van de RDW halen we merk, model en bouwjaar bij een kenteken. Het kenteken zelf slaan we niet op."
glossary.type_approval.term: "Typegoedkeuring"
glossary.type_approval.definition: "De goedkeuring van een voertuigtype door een keuringsinstantie in de EU, voordat het verkocht mag worden. Het typegoedkeuringsnummer laat zien om welk type en welke uitvoering het precies gaat."
glossary.eu_category.term: "EU-voertuigcategorie"
glossary.eu_category.definition: "De Europese indeling van voertuigen: M1 is een personenauto, N1 een bestelauto tot 3.500 kg, enzovoort. De regels voor rijhulpsystemen verschillen per categorie."
glossary.hybrid_class.term: "Hybride klasse"
glossary.hybrid_class.definition: "Hoe een hybride auto laadt, zoals de RDW dat registreert: OVC-HEV is een plug-in hybride die aan de stekker laadt, NOVC-HEV een hybride die alleen onderweg laadt."
glossary.recall.term: "Terugroepactie"
glossary.recall.definition: "Een oproep van de fabrikant om een voertuig te laten repareren of bijwerken vanwege een veiligheidsprobleem. Een openstaande terugroepactie is nog niet uitgevoerd. Die kan over iets heel anders gaan dan spookremmen."
glossary.software_version.term: "Softwareversie"
glossary.software_version.definition: "Veel auto's krijgen software-updates via de dealer of draadloos (over-the-air). Een update kan het remgedrag van de rijhulpsystemen veranderen; daarom vragen we naar de versie als je die weet."
glossary.ilt.term: "ILT"
glossary.ilt.definition: "De Inspectie Leefomgeving en Transport, een Nederlandse toezichthouder. Meld een gevaarlijk voertuig daar ook, zodat het officieel bekend is. Een melding hier vervangt dat niet."
glossary.sign_gantry.term: "Portaal / matrixbord"
glossary.sign_gantry.definition: "Een constructie over de weg met verkeersborden of matrixborden (de schermen met snelheden en kruisen boven de rijstroken). Rijhulpsystemen zien zo'n portaal soms aan voor een obstakel op de weg."
glossary.road_types.term: "A-weg, autoweg en N-weg"
glossary.road_types.definition: "Een A-weg is een autosnelweg. Een autoweg is een weg alleen voor snelverkeer, met een lagere maximumsnelheid dan een snelweg. Een N-weg is een genummerde weg buiten de snelwegen, vaak beheerd door de provincie."
glossary.rear_end.term: "Kop-staartbotsing"
glossary.rear_end.definition: "Een aanrijding waarbij een auto achter op zijn voorganger rijdt. Het grootste gevaar van spookremmen: de achterligger verwacht niet dat de auto ervoor plotseling remt."
faq.group.general: "Over phantom braking en het meldpunt"
faq.group.reporting: "Melden"
faq.group.privacy: "Privacy en beelden"
faq.group.data: "Gebruik van de gegevens"
faq.what.q: "Wat is phantom braking?"
faq.what.a: "Phantom braking (spookremmen) is wanneer de noodremassistent of adaptieve cruise control van een auto plotseling remt terwijl er niets is om voor te remmen. Vaak gebeurt dat bij viaducten, schaduwen, matrixborden of een vrachtwagen op de rijstrook ernaast. Sinds juli 2024 is een automatische noodrem (AEB) verplicht in elke nieuwe auto in de EU, dus steeds meer bestuurders krijgen ermee te maken."
faq.who.q: "Wie zit er achter dit meldpunt?"
faq.who.a: "Een onafhankelijk initiatief. We zijn niet verbonden aan autofabrikanten, importeurs, dealers, verzekeraars of overheden. Wie het meldpunt beheert en hoe je contact opneemt, staat in de <a href=\"{privacy}\">privacyverklaring</a>."
faq.why.q: "Waarom een apart meldpunt?"
faq.why.a: "Fabrikanten hoeven onterechte remingrepen nergens te registreren en delen hun voertuigdata niet. Officiële meldingen zijn er nauwelijks. Door meldingen met merk, model, locatie en omstandigheden te bundelen, worden patronen zichtbaar: welke auto’s, welke plekken, welke situaties."
faq.official.q: "Is dit een officiële melding?"
faq.official.a: "Nee. Meld een gevaarlijk voertuig ook bij de <a href=\"https://www.ilent.nl\" rel=\"noopener\">ILT</a> en bij je dealer, zodat het officieel bekend is. Bij een ongeval met gewonden bel je altijd 112."
faq.representative.q: "Zeggen de statistieken iets over hoe veilig een merk is?"
faq.representative.a: "Niet direct. Meldingen zijn ervaringen van bestuurders; we controleren ze niet technisch. Een model dat veel verkocht is, of een betrokken groep eigenaren heeft, krijgt vanzelf meer meldingen. Gebruik de cijfers om patronen te zien, niet als bewijs dat een voertuig een gebrek heeft."
faq.account.q: "Heb ik een account nodig?"
faq.account.a: "Nee. Je hebt geen account nodig en we vragen niet om je naam of e-mailadres. <a href=\"{report}\">Een melding doen</a> duurt ongeveer drie minuten."
faq.countries.q: "Welke auto’s kan ik melden?"
faq.countries.a: "Voorlopig auto’s met een Nederlands kenteken, omdat we de voertuiggegevens automatisch bij de RDW ophalen. Voor andere landen is er (nog) geen openbaar kentekenregister dat we kunnen gebruiken."
faq.abroad.q: "Het gebeurde in het buitenland. Kan ik het melden?"
faq.abroad.a: "Ja. Het land van het kenteken en het land waar het gebeurde zijn los van elkaar. Klik de plek aan op de kaart; we vullen het land en de weg dan zelf in."
faq.passenger.q: "Ik zat niet zelf achter het stuur. Mag ik het melden?"
faq.passenger.a: "Ja, als je het zelf hebt meegemaakt als inzittende van de auto. Meld het incident maar één keer per auto. Vul de melding nooit in tijdens het rijden."
faq.unsure.q: "Ik weet niet precies wat de oorzaak was. Wat vul ik in?"
faq.unsure.a: "Kies wat het beste past, of “Niets te zien” of “Anders”, en beschrijf het in de toelichting. Ook een onvolledige melding helpt: de plek, de auto en de omstandigheden zijn vaak al genoeg om een patroon te zien."
faq.plate.q: "Slaan jullie mijn kenteken op?"
faq.plate.a: "Nee. We gebruiken het kenteken alleen om de voertuiggegevens bij de RDW op te halen. Daarna bewaren we alleen een onomkeerbare vingerafdruk (met een geheime sleutel), zodat we herhaalde meldingen van dezelfde auto kunnen tellen. Het kenteken zelf wordt nergens opgeslagen of getoond."
faq.plate_needed.q: "Waarom moet ik dan een kenteken invullen?"
faq.plate_needed.a: "Zo krijgen we het exacte merk, model, bouwjaar en typegoedkeuring van de RDW, zonder tikfouten. Juist die details maken het mogelijk om te zien of een probleem bij een bepaald model of softwareversie hoort."
faq.footage.q: "Wat gebeurt er met mijn dashcambeelden en foto’s?"
faq.footage.a: "Ze blijven privé tot een beheerder ze heeft gecontroleerd. We verwijderen metagegevens zoals de GPS-locatie. Kentekens op foto’s maak je zelf zwart bij het uploaden, en de beheerder controleert dat. Dashcambeelden met een leesbaar kenteken publiceren we niet."
faq.withdraw.q: "Hoe trek ik mijn toestemming voor beelden en foto’s in?"
faq.withdraw.a: "Open je melding via <a href=\"{reports}\">Meldingen</a> en vraag daar verwijdering van de beelden en foto’s aan door het kenteken in te vullen. Klopt het, dan verwijdert een beheerder ze."
faq.delete_report.q: "Kan ik mijn hele melding laten verwijderen?"
faq.delete_report.a: "Ja. Neem contact op via de gegevens in de <a href=\"{privacy}\">privacyverklaring</a>. De melding verdwijnt dan ook uit de statistieken."
faq.reuse.q: "Wat gebeurt er met de meldingen?"
faq.reuse.a: "Meldingen worden zonder kenteken gepubliceerd en verwerkt in de statistieken op deze site. Wat we publiceren mag door anderen, zoals onderzoekers, journalisten en toezichthouders, worden gebruikt met bronvermelding. Zie de <a href=\"{terms}\">gebruiksvoorwaarden</a>."
faq.open_source.q: "Is de code openbaar?"
faq.open_source.a: "Ja. De broncode is open source (MIT-licentie) en staat op <a href=\"{github}\" rel=\"noopener\">GitHub</a>. Je kunt er zelf nalezen hoe we met kentekens en beelden omgaan."

