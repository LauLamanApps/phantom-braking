method.title: À propos de ces chiffres
method.text: "Il s’agit de signalements de conducteurs, et non de données d’accidents vérifiées. La marque, le modèle et l’année proviennent du registre national via la plaque ; nous n’acceptons que les signalements de pays dont nous pouvons interroger le registre. Une marque plus signalée peut simplement avoir plus de voitures sur la route : comparez donc avec la taille du parc. Les signalements répétés d’un même véhicule comptent comme des incidents distincts, mais « véhicules » compte chaque plaque une seule fois."

