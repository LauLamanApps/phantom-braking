faq.title: "Questions fréquentes"
faq.intro: "Réponses aux questions les plus courantes sur les freinages fantômes, les signalements et ce que nous faisons de vos données."
faq.more: "Votre question n’est pas dans la liste ? Contactez-nous grâce aux coordonnées indiquées dans la <a href=\"{privacy}\">politique de confidentialité</a>."
glossary.title: "Glossaire"
glossary.intro: "Que signifient AEB, ACC, GSR2 et les autres termes de ce site ? Les voici expliqués en quelques mots."
glossary.more: "Pour les questions sur le site lui-même, consultez les <a href=\"{faq}\">questions fréquentes</a>."
glossary.phantom_braking.term: "Freinage fantôme (phantom braking)"
glossary.phantom_braking.definition: "Une voiture qui freine d’elle-même alors qu’il n’y a aucune raison de freiner. L’aide à la conduite voit à tort un obstacle, par exemple dans une ombre, un pont ou un camion sur la voie voisine. Cela va d’un simple avertissement à un arrêt d’urgence complet."
glossary.false_positive.term: "Déclenchement intempestif"
glossary.false_positive.definition: "Une intervention du freinage d’urgence sans cause réelle : le système a cru voir une collision qui n’existait pas. Les constructeurs ne sont pas tenus de les signaler ; c’est pourquoi ce site les recueille."
glossary.aeb.term: "AEB (freinage d’urgence automatique)"
glossary.aeb.definition: "Autonomous Emergency Braking : un système qui surveille la route devant la voiture avec une caméra et/ou un radar et freine seul quand une collision menace. Il est activé par défaut à chaque trajet, même sans régulateur de vitesse. Obligatoire sur toute voiture neuve immatriculée dans l’UE depuis juillet 2024 (voir GSR2)."
glossary.fcw.term: "FCW (alerte de collision)"
glossary.fcw.definition: "Forward Collision Warning : avertit d’une collision imminente par un son ou un voyant, souvent juste avant que le freinage d’urgence intervienne. Un signalement avec seulement un avertissement compte ici comme la forme la plus légère de freinage fantôme."
glossary.adas.term: "ADAS (aides à la conduite)"
glossary.adas.definition: "Advanced Driver Assistance Systems : le terme générique pour les systèmes qui aident le conducteur, comme le freinage d’urgence automatique, le régulateur adaptatif et l’aide au maintien dans la voie. Le conducteur reste toujours responsable."
glossary.acc.term: "ACC (régulateur de vitesse adaptatif)"
glossary.acc.definition: "Un régulateur qui garde seul la distance avec la voiture qui précède, en ralentissant puis en accélérant à nouveau. L’ACC utilise la même caméra et le même radar que le freinage d’urgence et peut donc aussi freiner sans raison."
glossary.lane_assist.term: "Aide au centrage dans la voie"
glossary.lane_assist.definition: "Maintient la voiture au milieu de sa voie par de petites corrections de direction. Avec l’ACC, la voiture dirige, freine et accélère en grande partie seule sur autoroute, sous la surveillance du conducteur."
glossary.tad.term: "TAD (Tesla Assisted Driving)"
glossary.tad.definition: "L’aide à la conduite de Tesla, auparavant appelée FSD (Full Self-Driving). Elle dirige, freine et accélère sous la surveillance du conducteur ; la voiture ne roule pas de manière autonome."
glossary.sensors.term: "Caméra et radar"
glossary.sensors.definition: "Les yeux des aides à la conduite. Une caméra reconnaît les formes mais peut être éblouie par un soleil rasant ou trompée par des ombres. Un radar mesure la distance et la vitesse mais prend parfois des objets fixes, comme des ponts et des panneaux, pour des obstacles. Beaucoup de voitures combinent les deux (fusion de capteurs)."
glossary.gsr2.term: "GSR2"
glossary.gsr2.definition: "Le deuxième règlement général sur la sécurité de l’UE (règlement (UE) 2019/2144). Il rend notamment obligatoire le freinage d’urgence automatique : pour les nouveaux types de voitures depuis juillet 2022, pour toute voiture neuve immatriculée depuis juillet 2024. Pour chaque véhicule, nous indiquons s’il a été immatriculé après cette date."
glossary.rdw.term: "RDW"
glossary.rdw.definition: "L’autorité néerlandaise des véhicules (Rijksdienst voor het Wegverkeer) : elle autorise les véhicules sur les routes néerlandaises et tient le registre des plaques. Nous tirons des données ouvertes de la RDW la marque, le modèle et l’année d’une plaque. Nous ne conservons jamais la plaque elle-même."
glossary.type_approval.term: "Réception par type"
glossary.type_approval.definition: "L’homologation d’un type de véhicule par une autorité de l’UE avant sa mise en vente. Le numéro de réception indique précisément de quel type et de quelle version il s’agit."
glossary.eu_category.term: "Catégorie de véhicule de l’UE"
glossary.eu_category.definition: "La classification européenne des véhicules : M1 est une voiture particulière, N1 une camionnette jusqu’à 3 500 kg, etc. Les règles applicables aux aides à la conduite varient selon la catégorie."
glossary.hybrid_class.term: "Classe hybride"
glossary.hybrid_class.definition: "La façon dont une voiture hybride se recharge, telle qu’enregistrée par la RDW : OVC-HEV est une hybride rechargeable sur secteur, NOVC-HEV une hybride qui ne se recharge qu’en roulant."
glossary.recall.term: "Rappel"
glossary.recall.definition: "Un appel du constructeur à faire réparer ou mettre à jour un véhicule pour un problème de sécurité. Un rappel en cours n’a pas encore été effectué. Il peut porter sur tout autre chose que le freinage fantôme."
glossary.software_version.term: "Version du logiciel"
glossary.software_version.definition: "Beaucoup de voitures reçoivent des mises à jour chez le concessionnaire ou à distance (over the air). Une mise à jour peut modifier le freinage des aides à la conduite ; c’est pourquoi nous demandons la version si vous la connaissez."
glossary.ilt.term: "ILT"
glossary.ilt.definition: "L’Inspectie Leefomgeving en Transport, une autorité de contrôle néerlandaise. Signalez-y aussi un véhicule dangereux pour qu’il soit officiellement connu. Un signalement ici ne le remplace pas."
glossary.sign_gantry.term: "Portique de signalisation"
glossary.sign_gantry.definition: "Une structure au-dessus de la route portant des panneaux ou des panneaux à messages variables (les écrans affichant vitesses et croix au-dessus des voies). Les aides à la conduite prennent parfois un tel portique pour un obstacle sur la route."
glossary.road_types.term: "Route A, voie express et route N"
glossary.road_types.definition: "Aux Pays-Bas, une route A est une autoroute. Une voie express (autoweg) est réservée à la circulation rapide, avec une vitesse maximale inférieure à celle d’une autoroute. Une route N est une route numérotée hors du réseau autoroutier, souvent gérée par la province."
glossary.rear_end.term: "Collision par l’arrière"
glossary.rear_end.definition: "Un accident où une voiture percute celle qui la précède. Le plus grand danger du freinage fantôme : le conducteur qui suit ne s’attend pas à ce que la voiture devant lui freine brusquement."
faq.group.general: "Le freinage fantôme et ce site"
faq.group.reporting: "Signaler"
faq.group.privacy: "Vie privée et vidéos"
faq.group.data: "Utilisation des données"
faq.what.q: "Qu’est-ce qu’un freinage fantôme ?"
faq.what.a: "On parle de freinage fantôme lorsque l’assistance au freinage d’urgence ou le régulateur de vitesse adaptatif d’une voiture freine soudainement alors qu’il n’y a aucune raison de freiner. Cela se produit souvent au passage d’un pont, à cause d’ombres, sous des portiques de signalisation ou à côté d’un camion sur la voie voisine. Depuis juillet 2024, le freinage d’urgence automatique (AEB) est obligatoire sur toute voiture neuve dans l’UE ; de plus en plus de conducteurs y sont donc confrontés."
faq.who.q: "Qui gère ce point de signalement ?"
faq.who.a: "Une initiative indépendante. Nous n’avons aucun lien avec les constructeurs, importateurs, concessionnaires, assureurs ou pouvoirs publics. Qui se trouve derrière et comment nous contacter est indiqué dans la <a href=\"{privacy}\">politique de confidentialité</a>."
faq.why.q: "Pourquoi un point de signalement distinct ?"
faq.why.a: "Les constructeurs n’ont aucune obligation d’enregistrer les freinages intempestifs et ne partagent pas les données de leurs véhicules. Les signalements officiels sont quasi inexistants. En regroupant les signalements avec la marque, le modèle, le lieu et les circonstances, des tendances apparaissent : quelles voitures, quels endroits, quelles situations."
faq.official.q: "Est-ce un signalement officiel ?"
faq.official.a: "Non. Signalez aussi un véhicule dangereux à l’inspection néerlandaise des transports (<a href=\"https://www.ilent.nl\" rel=\"noopener\">ILT</a>) et à votre concessionnaire, afin qu’il soit officiellement enregistré. En cas d’accident avec blessés, appelez toujours le 112."
faq.representative.q: "Les statistiques disent-elles à quel point une marque est sûre ?"
faq.representative.a: "Pas directement. Les signalements sont des expériences de conducteurs ; nous ne les vérifions pas techniquement. Un modèle qui se vend bien, ou dont les propriétaires forment une communauté active, reçoit naturellement plus de signalements. Utilisez les chiffres pour repérer des tendances, pas comme preuve qu’un véhicule est défectueux."
faq.account.q: "Faut-il un compte ?"
faq.account.a: "Non. Vous n’avez pas besoin de compte et nous ne demandons ni votre nom ni votre adresse e-mail. <a href=\"{report}\">Envoyer un signalement</a> prend environ trois minutes."
faq.countries.q: "Quelles voitures puis-je signaler ?"
faq.countries.a: "Pour l’instant, les voitures immatriculées aux Pays-Bas, car nous récupérons automatiquement les informations du véhicule auprès du RDW (l’autorité néerlandaise des véhicules). Les autres pays ne disposent pas (encore) d’un registre public des plaques que nous pouvons utiliser."
faq.abroad.q: "C’est arrivé à l’étranger. Puis-je le signaler ?"
faq.abroad.a: "Oui. Le pays de la plaque et le pays où l’incident s’est produit sont indépendants. Cliquez sur l’endroit sur la carte et nous remplissons le pays et la route pour vous."
faq.passenger.q: "Je ne conduisais pas. Puis-je le signaler ?"
faq.passenger.a: "Oui, si vous l’avez vécu vous-même en tant qu’occupant de la voiture. Ne signalez chaque incident qu’une seule fois par voiture. Ne remplissez jamais le signalement en conduisant."
faq.unsure.q: "Je ne sais pas exactement ce qui l’a provoqué. Que dois-je indiquer ?"
faq.unsure.a: "Choisissez ce qui correspond le mieux, ou « Rien de visible » ou « Autre », et décrivez-le dans les remarques. Un signalement incomplet reste utile : le lieu, la voiture et les circonstances suffisent souvent à faire apparaître une tendance."
faq.plate.q: "Conservez-vous ma plaque d’immatriculation ?"
faq.plate.a: "Non. Nous utilisons la plaque uniquement pour récupérer les informations du véhicule auprès du RDW. Ensuite, nous ne gardons qu’une empreinte irréversible (créée avec une clé secrète), afin de pouvoir compter les signalements répétés d’une même voiture. La plaque elle-même n’est jamais conservée ni affichée."
faq.plate_needed.q: "Alors pourquoi dois-je saisir une plaque ?"
faq.plate_needed.a: "Elle nous permet d’obtenir du RDW la marque, le modèle, l’année et la réception par type exacts, sans faute de frappe. Ce sont ces informations qui permettent de voir si un problème concerne un modèle ou une version logicielle précise."
faq.footage.q: "Que deviennent mes vidéos de dashcam et mes photos ?"
faq.footage.a: "Elles restent privées jusqu’à leur vérification par un modérateur. Nous supprimons les métadonnées comme la position GPS. Vous masquez les plaques sur les photos lors de l’envoi, et le modérateur le vérifie. Nous ne publions pas de vidéos de dashcam où une plaque est lisible."
faq.withdraw.q: "Comment retirer mon consentement pour les vidéos et les photos ?"
faq.withdraw.a: "Ouvrez votre signalement via <a href=\"{reports}\">Signalements</a> et demandez-y la suppression des vidéos et des photos en saisissant la plaque. Si elle correspond, un modérateur les supprime."
faq.delete_report.q: "Puis-je faire supprimer tout mon signalement ?"
faq.delete_report.a: "Oui. Contactez-nous grâce aux coordonnées indiquées dans la <a href=\"{privacy}\">politique de confidentialité</a>. Le signalement est alors aussi retiré des statistiques."
faq.reuse.q: "Que deviennent les signalements ?"
faq.reuse.a: "Les signalements sont publiés sans la plaque et intégrés aux statistiques de ce site. Ce que nous publions peut être réutilisé par d’autres, comme des chercheurs, des journalistes et des autorités de contrôle, avec mention de la source. Voir les <a href=\"{terms}\">conditions d’utilisation</a>."
faq.open_source.q: "Le code est-il public ?"
faq.open_source.a: "Oui. Le code source est open source (licence MIT) et disponible sur <a href=\"{github}\" rel=\"noopener\">GitHub</a>. Vous pouvez vérifier vous-même comment nous traitons les plaques et les vidéos."

