about.mission: Point de signalement indépendant. Les constructeurs n’ont aucune obligation d’enregistrer les freinages fantômes. Ces signalements rendent le problème mesurable.
about.privacy: Nous ne conservons jamais votre plaque d’immatriculation, seulement une empreinte irréversible qui nous permet de compter les signalements répétés par véhicule. Les vidéos de dashcam ne sont publiées qu’après vérification et avec votre consentement.
about.sources: 'Données des véhicules : <a class="underline" href="https://opendata.rdw.nl" rel="noopener">RDW Open Data</a>. Carte : <a class="underline" href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a>. Signalez aussi un véhicule dangereux à l’inspection néerlandaise des transports (<a class="underline" href="https://www.ilent.nl" rel="noopener">ILT</a>).'
