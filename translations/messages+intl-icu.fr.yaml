home.title: Statistiques
home.headline: "Freinage injustifié ? Signalez-le."
home.intro: "Depuis juillet 2024, le freinage d’urgence automatique (AEB) est obligatoire sur toute voiture neuve dans l’UE. De plus en plus de conducteurs signalent que leur voiture freine brutalement en pleine vitesse sans aucune raison. Presque personne ne l’enregistre officiellement."
home.cta: Signaler un incident
home.browse: Parcourir les signalements
home.why.title: Pourquoi ce point de signalement ?
home.why.1: "<a href=\"{kassa}\" target=\"_blank\" rel=\"noopener\">Kassa</a> (une émission de consommateurs néerlandaise) estime qu’il y a au moins plusieurs centaines d’incidents par an. L’ILT n’a reçu que vingt signalements en quatre ans."
home.why.2: Les constructeurs ne partagent pas les données des véhicules et n’ont pas à déclarer les freinages intempestifs.
home.why.3: Avec la plaque, le lieu et les circonstances, un schéma se dessine que les constructeurs, les autorités de contrôle et les responsables politiques ne peuvent pas ignorer.
home.empty.title: Aucun signalement pour l’instant
home.empty.text: Soyez le premier. Chaque signalement aide à rendre le phénomène visible.
home.kpis: Chiffres clés

