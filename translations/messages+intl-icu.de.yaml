method.title: Über diese Zahlen
method.text: "Das sind Meldungen von Fahrerinnen und Fahrern, keine geprüften Unfalldaten. Marke, Modell und Baujahr stammen über das Kennzeichen aus dem nationalen Register; wir nehmen nur Meldungen aus Ländern an, deren Register wir abfragen können. Eine Marke mit mehr Meldungen hat vielleicht einfach mehr Autos auf der Straße, vergleiche daher mit dem Fahrzeugbestand. Wiederholte Meldungen desselben Fahrzeugs zählen als eigene Vorfälle, aber „Fahrzeuge“ zählt jedes Kennzeichen nur einmal."

