faq.title: "Häufig gestellte Fragen"
faq.intro: "Antworten auf die häufigsten Fragen zu Phantombremsungen, zum Melden und dazu, was wir mit deinen Daten machen."
faq.more: "Deine Frage ist nicht dabei? Melde dich über die Kontaktdaten in der <a href=\"{privacy}\">Datenschutzerklärung</a>."
glossary.title: "Glossar"
glossary.intro: "Was bedeuten AEB, ACC, GSR2 und die anderen Begriffe auf dieser Website? Hier sind sie kurz erklärt."
glossary.more: "Fragen zur Meldestelle selbst beantworten die <a href=\"{faq}\">häufig gestellten Fragen</a>."
glossary.phantom_braking.term: "Phantombremsung (phantom braking)"
glossary.phantom_braking.definition: "Ein Auto bremst von selbst, obwohl es keinen Grund dafür gibt. Das Fahrassistenzsystem erkennt fälschlich ein Hindernis, etwa in einem Schatten, einer Brücke oder einem Lkw auf der Nebenspur. Das reicht von einer kurzen Warnung bis zur Vollbremsung."
glossary.false_positive.term: "Fehlauslösung"
glossary.false_positive.definition: "Ein Eingriff des Notbremsassistenten ohne echten Anlass: Das System glaubte, eine Kollision zu erkennen, die es nicht gab. Hersteller müssen solche Fälle nicht melden, deshalb sammelt diese Meldestelle sie."
glossary.aeb.term: "AEB (Notbremsassistent)"
glossary.aeb.definition: "Autonomous Emergency Braking: ein System, das die Straße vor dem Auto mit Kamera und/oder Radar überwacht und selbst bremst, wenn eine Kollision droht. Es ist bei jeder Fahrt standardmäßig aktiv, auch ohne Tempomat. Seit Juli 2024 Pflicht in jedem neu zugelassenen Auto in der EU (siehe GSR2)."
glossary.fcw.term: "FCW (Kollisionswarnung)"
glossary.fcw.definition: "Forward Collision Warning: warnt mit einem Ton oder einer Leuchte vor einer drohenden Kollision, oft kurz bevor der Notbremsassistent eingreift. Eine Meldung mit nur einer Warnung gilt hier als leichteste Form der Phantombremsung."
glossary.adas.term: "ADAS (Fahrassistenzsysteme)"
glossary.adas.definition: "Advanced Driver Assistance Systems: der Sammelbegriff für Systeme, die Fahrerinnen und Fahrer unterstützen, etwa Notbremsassistent, Abstandstempomat und Spurhalteassistent. Die Verantwortung bleibt immer beim Menschen am Steuer."
glossary.acc.term: "ACC (Abstandstempomat)"
glossary.acc.definition: "Adaptive Cruise Control: ein Tempomat, der selbst Abstand zum vorausfahrenden Auto hält, abbremst und wieder beschleunigt. ACC nutzt dieselbe Kamera und dasselbe Radar wie der Notbremsassistent und kann daher ebenfalls grundlos bremsen."
glossary.lane_assist.term: "Spurhalteassistent"
glossary.lane_assist.definition: "Hält das Auto mit kleinen Lenkkorrekturen in der Mitte der Fahrspur. Zusammen mit ACC lenkt, bremst und beschleunigt das Auto auf der Autobahn weitgehend selbst, unter Aufsicht des Menschen am Steuer."
glossary.tad.term: "TAD (Tesla Assisted Driving)"
glossary.tad.definition: "Das Fahrassistenzsystem von Tesla, früher FSD (Full Self-Driving) genannt. Es lenkt, bremst und beschleunigt unter Aufsicht des Menschen am Steuer; das Auto fährt nicht selbstständig."
glossary.sensors.term: "Kamera und Radar"
glossary.sensors.definition: "Die Augen der Fahrassistenzsysteme. Eine Kamera erkennt Formen, kann aber von tiefstehender Sonne geblendet oder von Schatten verwirrt werden. Ein Radar misst Abstand und Geschwindigkeit, hält aber feste Objekte wie Brücken und Schilder manchmal für Hindernisse. Viele Autos kombinieren beides (Sensorfusion)."
glossary.gsr2.term: "GSR2"
glossary.gsr2.definition: "Die zweite General Safety Regulation der EU (Verordnung (EU) 2019/2144). Sie schreibt unter anderem den Notbremsassistenten vor: für neue Fahrzeugtypen seit Juli 2022, für jedes neu zugelassene Auto seit Juli 2024. Zu jedem Fahrzeug zeigen wir, ob es nach diesem Datum zugelassen wurde."
glossary.rdw.term: "RDW"
glossary.rdw.definition: "Die niederländische Zulassungsbehörde (Rijksdienst voor het Wegverkeer): Sie lässt Fahrzeuge für niederländische Straßen zu und führt das Kennzeichenregister. Aus den offenen Daten der RDW holen wir Marke, Modell und Baujahr zu einem Kennzeichen. Das Kennzeichen selbst speichern wir nicht."
glossary.type_approval.term: "Typgenehmigung"
glossary.type_approval.definition: "Die Genehmigung eines Fahrzeugtyps durch eine Prüfbehörde in der EU, bevor er verkauft werden darf. Die Typgenehmigungsnummer zeigt genau, um welchen Typ und welche Ausführung es sich handelt."
glossary.eu_category.term: "EU-Fahrzeugklasse"
glossary.eu_category.definition: "Die europäische Einteilung von Fahrzeugen: M1 ist ein Pkw, N1 ein Lieferwagen bis 3.500 kg und so weiter. Die Regeln für Fahrassistenzsysteme unterscheiden sich je nach Klasse."
glossary.hybrid_class.term: "Hybridklasse"
glossary.hybrid_class.definition: "Wie ein Hybridauto lädt, so wie die RDW es erfasst: OVC-HEV ist ein Plug-in-Hybrid, der an der Steckdose lädt, NOVC-HEV ein Hybrid, der nur während der Fahrt lädt."
glossary.recall.term: "Rückruf"
glossary.recall.definition: "Ein Aufruf des Herstellers, ein Fahrzeug wegen eines Sicherheitsproblems reparieren oder aktualisieren zu lassen. Ein offener Rückruf ist noch nicht durchgeführt. Er kann etwas ganz anderes betreffen als Phantombremsungen."
glossary.software_version.term: "Softwareversion"
glossary.software_version.definition: "Viele Autos erhalten Software-Updates in der Werkstatt oder drahtlos (over the air). Ein Update kann das Bremsverhalten der Fahrassistenzsysteme ändern; deshalb fragen wir nach der Version, falls du sie kennst."
glossary.ilt.term: "ILT"
glossary.ilt.definition: "Die Inspectie Leefomgeving en Transport, eine niederländische Aufsichtsbehörde. Melde ein gefährliches Fahrzeug auch dort, damit es offiziell bekannt ist. Eine Meldung hier ersetzt das nicht."
glossary.sign_gantry.term: "Schilderbrücke"
glossary.sign_gantry.definition: "Eine Konstruktion über der Fahrbahn mit Verkehrsschildern oder Wechselverkehrszeichen (den Anzeigen mit Geschwindigkeiten und Kreuzen über den Spuren). Fahrassistenzsysteme halten eine solche Brücke manchmal für ein Hindernis auf der Straße."
glossary.road_types.term: "A-Straße, Kraftfahrstraße und N-Straße"
glossary.road_types.definition: "In den Niederlanden ist eine A-Straße eine Autobahn. Eine Kraftfahrstraße (autoweg) ist nur für schnelle Fahrzeuge, mit einer niedrigeren Höchstgeschwindigkeit als eine Autobahn. Eine N-Straße ist eine nummerierte Straße außerhalb des Autobahnnetzes, oft von der Provinz verwaltet."
glossary.rear_end.term: "Auffahrunfall"
glossary.rear_end.definition: "Ein Unfall, bei dem ein Auto auf das vorausfahrende auffährt. Die größte Gefahr von Phantombremsungen: Wer dahinter fährt, rechnet nicht damit, dass das Auto davor plötzlich bremst."
faq.group.general: "Über Phantombremsungen und diese Website"
faq.group.reporting: "Melden"
faq.group.privacy: "Datenschutz und Aufnahmen"
faq.group.data: "Wie die Daten verwendet werden"
faq.what.q: "Was ist eine Phantombremsung?"
faq.what.a: "Von einer Phantombremsung spricht man, wenn der Notbremsassistent oder der Abstandsregeltempomat eines Autos plötzlich bremst, obwohl es keinen Grund dafür gibt. Das passiert oft an Überführungen, bei Schatten, unter Schilderbrücken oder neben einem Lkw auf der Nachbarspur. Seit Juli 2024 ist der automatische Notbremsassistent (AEB) in jedem Neuwagen in der EU Pflicht, deshalb erleben es immer mehr Fahrerinnen und Fahrer."
faq.who.q: "Wer betreibt diese Meldestelle?"
faq.who.a: "Eine unabhängige Initiative. Wir sind nicht mit Autoherstellern, Importeuren, Händlern, Versicherern oder Behörden verbunden. Wer dahintersteht und wie du Kontakt aufnimmst, steht in der <a href=\"{privacy}\">Datenschutzerklärung</a>."
faq.why.q: "Warum eine eigene Meldestelle?"
faq.why.a: "Hersteller müssen Fehlbremsungen nirgends registrieren und teilen ihre Fahrzeugdaten nicht. Offizielle Meldungen gibt es kaum. Wenn Meldungen mit Marke, Modell, Ort und Umständen gebündelt werden, zeigen sich Muster: welche Autos, welche Orte, welche Situationen."
faq.official.q: "Ist das eine offizielle Meldung?"
faq.official.a: "Nein. Melde ein gefährliches Fahrzeug bitte auch der niederländischen <a href=\"https://www.ilent.nl\" rel=\"noopener\">ILT</a> und deinem Händler, damit es offiziell erfasst ist. Bei einem Unfall mit Verletzten ruf immer 112 an."
faq.representative.q: "Sagen die Statistiken, wie sicher eine Marke ist?"
faq.representative.a: "Nicht direkt. Meldungen sind Erfahrungen von Fahrerinnen und Fahrern; wir prüfen sie nicht technisch. Ein Modell, das sich gut verkauft oder eine engagierte Gruppe von Besitzerinnen und Besitzern hat, bekommt naturgemäß mehr Meldungen. Nutze die Zahlen, um Muster zu erkennen, nicht als Beweis, dass ein Fahrzeug defekt ist."
faq.account.q: "Brauche ich ein Konto?"
faq.account.a: "Nein. Du brauchst kein Konto, und wir fragen nicht nach deinem Namen oder deiner E-Mail-Adresse. <a href=\"{report}\">Eine Meldung abzugeben</a> dauert etwa drei Minuten."
faq.countries.q: "Welche Autos kann ich melden?"
faq.countries.a: "Vorerst Autos mit niederländischem Kennzeichen, weil wir die Fahrzeugdaten automatisch beim RDW (der niederländischen Fahrzeugbehörde) abrufen. Andere Länder haben (noch) kein öffentliches Kennzeichenregister, das wir nutzen können."
faq.abroad.q: "Es ist im Ausland passiert. Kann ich es melden?"
faq.abroad.a: "Ja. Das Land des Kennzeichens und das Land, in dem es passiert ist, sind voneinander unabhängig. Klicke die Stelle auf der Karte an, dann tragen wir Land und Straße für dich ein."
faq.passenger.q: "Ich bin nicht selbst gefahren. Darf ich es melden?"
faq.passenger.a: "Ja, wenn du es selbst als Insasse des Autos erlebt hast. Melde jeden Vorfall nur einmal pro Auto. Fülle die Meldung nie während der Fahrt aus."
faq.unsure.q: "Ich weiß nicht genau, was die Ursache war. Was soll ich angeben?"
faq.unsure.a: "Wähle, was am besten passt, oder „Nichts zu sehen“ bzw. „Sonstiges“, und beschreibe es in den Anmerkungen. Auch eine unvollständige Meldung hilft: Ort, Auto und Umstände reichen oft schon, um ein Muster zu erkennen."
faq.plate.q: "Speichert ihr mein Kennzeichen?"
faq.plate.a: "Nein. Wir nutzen das Kennzeichen nur, um die Fahrzeugdaten beim RDW abzurufen. Danach behalten wir nur einen nicht umkehrbaren Fingerabdruck (erstellt mit einem geheimen Schlüssel), damit wir wiederholte Meldungen desselben Autos zählen können. Das Kennzeichen selbst wird nie gespeichert oder angezeigt."
faq.plate_needed.q: "Warum muss ich dann überhaupt ein Kennzeichen eingeben?"
faq.plate_needed.a: "So bekommen wir vom RDW genau Marke, Modell, Baujahr und Typgenehmigung, ohne Tippfehler. Erst diese Angaben machen sichtbar, ob ein Problem zu einem bestimmten Modell oder einer bestimmten Softwareversion gehört."
faq.footage.q: "Was passiert mit meinen Dashcam-Aufnahmen und Fotos?"
faq.footage.a: "Sie bleiben privat, bis eine Moderatorin oder ein Moderator sie geprüft hat. Wir entfernen Metadaten wie den GPS-Standort. Kennzeichen auf Fotos schwärzt du beim Hochladen, und die Moderatorin oder der Moderator prüft das. Dashcam-Aufnahmen mit lesbarem Kennzeichen veröffentlichen wir nicht."
faq.withdraw.q: "Wie widerrufe ich meine Einwilligung für Aufnahmen und Fotos?"
faq.withdraw.a: "Öffne deine Meldung über <a href=\"{reports}\">Meldungen</a> und beantrage dort die Löschung der Aufnahmen und Fotos, indem du das Kennzeichen eingibst. Passt es, löscht eine Moderatorin oder ein Moderator sie."
faq.delete_report.q: "Kann ich meine ganze Meldung löschen lassen?"
faq.delete_report.a: "Ja. Melde dich über die Kontaktdaten in der <a href=\"{privacy}\">Datenschutzerklärung</a>. Die Meldung wird dann auch aus den Statistiken entfernt."
faq.reuse.q: "Was passiert mit den Meldungen?"
faq.reuse.a: "Meldungen werden ohne Kennzeichen veröffentlicht und in die Statistiken auf dieser Website aufgenommen. Was wir veröffentlichen, dürfen andere, etwa Forschende, Journalistinnen und Journalisten sowie Aufsichtsbehörden, mit Quellenangabe verwenden. Siehe die <a href=\"{terms}\">Nutzungsbedingungen</a>."
faq.open_source.q: "Ist der Code öffentlich?"
faq.open_source.a: "Ja. Der Quellcode ist Open Source (MIT-Lizenz) und auf <a href=\"{github}\" rel=\"noopener\">GitHub</a> verfügbar. Du kannst selbst nachsehen, wie wir mit Kennzeichen und Aufnahmen umgehen."

