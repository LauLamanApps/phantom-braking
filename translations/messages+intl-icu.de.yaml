home.title: Statistiken
home.headline: "Grundlos gebremst? Melde es."
home.intro: "Seit Juli 2024 ist der automatische Notbremsassistent (AEB) in jedem Neuwagen in der EU Pflicht. Immer mehr Fahrerinnen und Fahrer berichten, dass ihr Auto bei voller Fahrt stark bremst, ohne dass es einen Anlass dafür gibt. Offiziell erfasst wird das kaum."
home.cta: Vorfall melden
home.browse: Meldungen ansehen
home.why.title: Warum diese Meldestelle?
home.why.1: "<a href=\"{kassa}\" target=\"_blank\" rel=\"noopener\">Kassa</a> (eine niederländische Verbrauchersendung) schätzt mindestens Hunderte Vorfälle pro Jahr. Die ILT erhielt in vier Jahren nur zwanzig Meldungen."
home.why.2: Hersteller teilen keine Fahrzeugdaten und müssen Fehlauslösungen der Bremse nicht melden.
home.why.3: Mit Kennzeichen, Ort und Umständen entsteht ein Muster, das Hersteller, Behörden und Politik nicht ignorieren können.
home.empty.title: Noch keine Meldungen
home.empty.text: Sei die oder der Erste. Jede Meldung hilft, das Muster sichtbar zu machen.
