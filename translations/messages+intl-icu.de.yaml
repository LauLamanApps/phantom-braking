about.mission: Unabhängige Meldestelle. Hersteller müssen Phantombremsungen nirgends registrieren. Diese Meldungen machen das Problem messbar.
about.privacy: Wir speichern dein Kennzeichen nie. Wir behalten nur einen nicht umkehrbaren Fingerabdruck, um wiederholte Meldungen pro Fahrzeug zählen zu können. Dashcam-Aufnahmen werden erst nach Prüfung und mit deiner Einwilligung veröffentlicht.
