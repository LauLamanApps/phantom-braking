about.mission: Independent reporting point. Manufacturers don't have to register phantom braking anywhere. These reports make the problem measurable.
about.privacy: We never store your license plate. We keep only an irreversible fingerprint so we can count repeat reports per vehicle. Dashcam footage is only published after review and with your consent.
about.sources: 'Vehicle data: <a class="underline" href="https://opendata.rdw.nl" rel="noopener">RDW Open Data</a>. Map: <a class="underline" href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a>. Please also report a dangerous vehicle to the Dutch <a class="underline" href="https://www.ilent.nl" rel="noopener">ILT</a>.'
