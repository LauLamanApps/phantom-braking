glossary.title: "Glossary"
glossary.intro: "What do AEB, ACC, GSR2 and the other terms on this site mean? Here they are, briefly explained."
glossary.more: "For questions about the reporting point itself, see the <a href=\"{faq}\">frequently asked questions</a>."
glossary.phantom_braking.term: "Phantom braking"
glossary.phantom_braking.definition: "A car braking by itself when there is nothing to brake for. The driver assistance system wrongly sees an obstacle, for example in a shadow, a viaduct or a lorry in the next lane. It ranges from a brief warning to a full emergency stop."
glossary.false_positive.term: "False activation"
glossary.false_positive.definition: "An intervention by the emergency braking system without a real cause: the system thought it saw a collision that was not there. Manufacturers do not have to report these, which is why this reporting point collects them."
glossary.aeb.term: "AEB (Autonomous Emergency Braking)"
glossary.aeb.definition: "A system that watches the road ahead with a camera and/or radar and brakes by itself when a collision is imminent. It is on by default on every drive, even without cruise control. Mandatory in every newly registered car in the EU since July 2024 (see GSR2)."
glossary.fcw.term: "FCW (Forward Collision Warning)"
glossary.fcw.definition: "Warns of an imminent collision with a sound or a light, often just before automatic emergency braking steps in. A report with only a warning counts here as the mildest form of phantom braking."
glossary.adas.term: "ADAS (driver assistance systems)"
glossary.adas.definition: "Advanced Driver Assistance Systems: the umbrella term for systems that help the driver, such as automatic emergency braking, adaptive cruise control and lane centring. The driver always remains responsible."
glossary.acc.term: "ACC (adaptive cruise control)"
glossary.acc.definition: "Cruise control that keeps its distance to the car in front by itself, slowing down and speeding up again. ACC uses the same camera and radar as emergency braking, so it can brake for no reason too."
glossary.lane_assist.term: "Lane centring"
glossary.lane_assist.definition: "Keeps the car in the middle of its lane with small steering corrections. Together with ACC, the car largely steers, brakes and accelerates by itself on the motorway, supervised by the driver."
glossary.tad.term: "TAD (Tesla Assisted Driving)"
glossary.tad.definition: "Tesla's driver assistance system, previously called FSD (Full Self-Driving). It steers, brakes and accelerates under the driver's supervision; the car does not drive itself."
glossary.sensors.term: "Camera and radar"
glossary.sensors.definition: "The eyes of driver assistance systems. A camera recognises shapes but can be dazzled by a low sun or confused by shadows. A radar measures distance and speed but sometimes sees fixed objects such as viaducts and signs as obstacles. Many cars combine both (sensor fusion)."
glossary.gsr2.term: "GSR2"
glossary.gsr2.definition: "The EU's second General Safety Regulation (Regulation (EU) 2019/2144). Among other things it makes automatic emergency braking mandatory: for new car types since July 2022, for every newly registered car since July 2024. For each vehicle we show whether it was registered after that date."
glossary.rdw.term: "RDW"
glossary.rdw.definition: "The Dutch Vehicle Authority (Rijksdienst voor het Wegverkeer): it admits vehicles to Dutch roads and keeps the licence plate register. From the RDW's open data we fetch the make, model and year for a plate. We never store the plate itself."
glossary.type_approval.term: "Type approval"
glossary.type_approval.definition: "Approval of a vehicle type by a testing authority in the EU before it may be sold. The type approval number shows exactly which type and version a vehicle is."
glossary.eu_category.term: "EU vehicle category"
glossary.eu_category.definition: "The European classification of vehicles: M1 is a passenger car, N1 a van up to 3,500 kg, and so on. The rules for driver assistance systems differ per category."
glossary.hybrid_class.term: "Hybrid class"
glossary.hybrid_class.definition: "How a hybrid car charges, as registered by the RDW: OVC-HEV is a plug-in hybrid that charges from the mains, NOVC-HEV a hybrid that only charges while driving."
glossary.recall.term: "Recall"
glossary.recall.definition: "A call from the manufacturer to have a vehicle repaired or updated because of a safety issue. An open recall has not been carried out yet. It may be about something entirely different from phantom braking."
glossary.software_version.term: "Software version"
glossary.software_version.definition: "Many cars receive software updates at the dealer or wirelessly (over the air). An update can change how the driver assistance systems brake, which is why we ask for the version if you know it."
glossary.ilt.term: "ILT"
glossary.ilt.definition: "The Human Environment and Transport Inspectorate (Inspectie Leefomgeving en Transport), a Dutch regulator. Report a dangerous vehicle there too, so it is officially known. A report here does not replace that."
glossary.sign_gantry.term: "Sign gantry"
glossary.sign_gantry.definition: "A structure spanning the road that carries traffic signs or matrix signs (the screens showing speeds and crosses above the lanes). Driver assistance systems sometimes mistake such a gantry for an obstacle on the road."
glossary.road_types.term: "Motorway, expressway and N road"
glossary.road_types.definition: "In the Netherlands an A road is a motorway. An expressway (autoweg) is a road for fast traffic only, with a lower speed limit than a motorway. An N road is a numbered road outside the motorway network, often managed by the province."
glossary.rear_end.term: "Rear-end collision"
glossary.rear_end.definition: "A collision in which a car runs into the back of the car in front. The biggest danger of phantom braking: the driver behind does not expect the car ahead to brake suddenly."
faq.group.general: "About phantom braking and this site"
faq.group.reporting: "Reporting"
faq.group.privacy: "Privacy and footage"
faq.group.data: "How the data is used"
faq.what.q: "What is phantom braking?"
faq.what.a: "Phantom braking is when a car’s emergency brake assist or adaptive cruise control suddenly brakes although there is nothing to brake for. It often happens at overpasses, shadows, overhead signs or next to a truck in the adjacent lane. Since July 2024 automatic emergency braking (AEB) is mandatory in every new car in the EU, so more and more drivers run into it."
faq.who.q: "Who runs this reporting point?"
faq.who.a: "An independent initiative. We are not affiliated with car makers, importers, dealers, insurers or governments. Who runs it and how to get in touch is in the <a href=\"{privacy}\">privacy statement</a>."
faq.why.q: "Why a separate reporting point?"
faq.why.a: "Manufacturers don’t have to register false braking events anywhere and don’t share their vehicle data. Official reports barely exist. Bundling reports with make, model, location and circumstances reveals patterns: which cars, which places, which situations."
faq.official.q: "Is this an official report?"
faq.official.a: "No. Please also report a dangerous vehicle to the Dutch <a href=\"https://www.ilent.nl\" rel=\"noopener\">ILT</a> and to your dealer, so it is officially on record. In an accident with injuries, always call 112."
faq.representative.q: "Do the statistics say how safe a make is?"
faq.representative.a: "Not directly. Reports are drivers’ experiences; we don’t verify them technically. A model that sells well, or has an engaged group of owners, naturally gets more reports. Use the figures to spot patterns, not as proof that a vehicle is defective."
faq.account.q: "Do I need an account?"
faq.account.a: "No. You don’t need an account and we don’t ask for your name or email address. <a href=\"{report}\">Submitting a report</a> takes about three minutes."
faq.countries.q: "Which cars can I report?"
faq.countries.a: "For now, cars with a Dutch licence plate, because we fetch the vehicle details automatically from the RDW (the Dutch vehicle authority). Other countries don’t (yet) have a public plate register we can use."
faq.abroad.q: "It happened abroad. Can I report it?"
faq.abroad.a: "Yes. The country of the plate and the country where it happened are separate. Click the spot on the map and we fill in the country and road for you."
faq.passenger.q: "I wasn’t driving. May I report it?"
faq.passenger.a: "Yes, if you experienced it yourself as an occupant of the car. Report each incident only once per car. Never fill in the report while driving."
faq.unsure.q: "I’m not sure what caused it. What should I fill in?"
faq.unsure.a: "Choose what fits best, or “Nothing visible” or “Other”, and describe it in the comments. An incomplete report still helps: the place, the car and the circumstances are often enough to see a pattern."
faq.plate.q: "Do you store my licence plate?"
faq.plate.a: "No. We only use the plate to fetch the vehicle details from the RDW. After that we keep only an irreversible fingerprint (made with a secret key), so we can count repeat reports of the same car. The plate itself is never stored or shown."
faq.plate_needed.q: "Then why do I have to enter a plate?"
faq.plate_needed.a: "It gets us the exact make, model, year and type approval from the RDW, without typos. Those details are what make it possible to see whether a problem belongs to a specific model or software version."
faq.footage.q: "What happens to my dashcam footage and photos?"
faq.footage.a: "They stay private until a moderator has reviewed them. We remove metadata such as the GPS location. You black out plates on photos when uploading, and the moderator checks that. We don’t publish dashcam footage with a readable plate."
faq.withdraw.q: "How do I withdraw my consent for footage and photos?"
faq.withdraw.a: "Open your report via <a href=\"{reports}\">Reports</a> and request deletion of the footage and photos there by entering the plate. If it matches, a moderator deletes them."
faq.delete_report.q: "Can I have my whole report deleted?"
faq.delete_report.a: "Yes. Get in touch using the details in the <a href=\"{privacy}\">privacy statement</a>. The report is then also removed from the statistics."
faq.reuse.q: "What happens to the reports?"
faq.reuse.a: "Reports are published without the plate and included in the statistics on this site. What we publish may be used by others, such as researchers, journalists and regulators, with attribution. See the <a href=\"{terms}\">terms of use</a>."
faq.open_source.q: "Is the code public?"
faq.open_source.a: "Yes. The source code is open source (MIT licence) and available on <a href=\"{github}\" rel=\"noopener\">GitHub</a>. You can check for yourself how we handle plates and footage."

