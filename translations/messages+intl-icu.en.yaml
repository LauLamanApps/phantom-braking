method.title: About these numbers
method.text: "These are reports by drivers, not verified accident data. Make, model and year come from the national register via the plate; we only accept reports from countries whose register we can query. A make with more reports may simply have more cars on the road, so compare with fleet size. Repeat reports of the same vehicle count as separate incidents, but 'vehicles' counts each plate once."

