home.title: Statistics
home.headline: "Braking for no reason? Report it."
home.intro: "Since July 2024, automatic emergency braking (AEB) has been mandatory in every new car in the EU. More and more drivers report their car braking hard at full speed for no reason. Hardly anyone records this officially."
home.cta: Report an incident
home.browse: Browse reports
home.why.title: Why this reporting point?
home.why.1: "Kassa (a Dutch consumer TV show) estimates at least hundreds of incidents a year. The ILT received only twenty reports in four years."
home.why.2: Manufacturers don't share vehicle data and don't have to report false brake interventions.
home.why.3: With plate, location and circumstances, a pattern emerges that manufacturers, regulators and politicians cannot ignore.
home.empty.title: No reports yet
home.empty.text: Be the first. Every report helps make the pattern visible.
