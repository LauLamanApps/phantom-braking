# Weekly dependency updates. Minor and patch updates come grouped in one PR per ecosystem;
# major updates get a PR of their own. CI (.github/workflows/ci.yml) runs on every PR.
# JavaScript packages (importmap.php) aren't supported by Dependabot: CI audits them instead.
version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 10
      groups:
          composer-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      groups:
          github-actions:
              patterns: ['*']

    # The dev stack's PHP image (.docker/php/Dockerfile).
    - package-ecosystem: docker
      directory: /.docker/php
      schedule:
          interval: monthly
