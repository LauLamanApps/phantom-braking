; Production PHP settings (FPM and CLI). Installed to /etc/php/8.5/{fpm,cli}/conf.d/ by provision.sh.

; Uploads: one dashcam video (max 300 MB) plus up to 6 photos (15 MB each) per report.
; Keep in sync with the nginx client_max_body_size and ReportIncidentData::MAX_FOOTAGE_SIZE.
upload_max_filesize = 300M
post_max_size = 400M
max_input_time = 300
max_execution_time = 300

; GD decodes photos to raw pixels: a 24-megapixel photo needs ~100 MB.
memory_limit = 512M

date.timezone = UTC
expose_php = Off

; Code only changes on deploy, which reloads PHP-FPM (deploy:opcache-reset).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
