; PHP-FPM pool sizing. Installed to /etc/php/8.5/fpm/pool.d/ by provision.sh; reopens the
; default [www] pool from www.conf (the zz- prefix makes it load last).
;
; Photos and videos are streamed through PHP (only moderated media is served), so a visitor
; watching a dashcam video on a slow connection holds a worker for the whole download, and a
; browser often opens a few range requests at once. Debian's default of 5 workers is used up
; by one or two such visitors, after which every other request waits.
;
; Memory: page and media requests stay well under 40 MB. Only submitting a report with photos
; needs more (GD, memory_limit 512M), and that is rare. 30 workers fit in the 4 GB container.
[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
