; Messenger worker for async events. Restarted on every deploy (deploy:restart-messenger).
[program:phantom-braking-messenger]
command=/usr/bin/php /var/www/phantombraking.eu/current/bin/console messenger:consume async --time-limit=3600 --memory-limit=256M
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/phantom-braking-messenger.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
