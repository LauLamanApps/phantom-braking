# Site vhost inside the LXC. TLS is terminated by the existing reverse proxy, which forwards
# plain HTTP here with X-Forwarded-For/-Proto/-Host (TRUSTED_PROXIES in .env.local).

# spook-remmen.nl → the Dutch home page of the main domain.
server {
    listen 80;
    server_name spook-remmen.nl www.spook-remmen.nl;
    return 301 https://phantombraking.eu/nl;
}

# www → apex.
server {
    listen 80;
    server_name www.phantombraking.eu;
    return 301 https://phantombraking.eu$request_uri;
}

server {
    listen 80 default_server;
    server_name phantombraking.eu;

    root /var/www/phantombraking.eu/current/public;

    # Video (300 MB) + photos (6 × 15 MB) per report; keep in sync with .deploy/php/99-phantom-braking.ini.
    # The reverse proxy needs the same limit.
    client_max_body_size 400M;
    client_body_timeout 300s;

    # Kept for at most 14 days (see the privacy statement): .deploy/logrotate/nginx-phantom-braking.
    access_log /var/log/nginx/phantombraking.eu.access.log;
    error_log /var/log/nginx/phantombraking.eu.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # AssetMapper files carry a content hash in their name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # The real path, so a deploy (symlink switch) never mixes releases.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Storing a large upload in S3 can take a while.
        fastcgi_read_timeout 300s;
        internal;
    }

    # No other PHP file is ever executed.
    location ~ \.php$ {
        return 404;
    }
}
